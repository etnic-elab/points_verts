flutter_launcher_icons:
  android: "ic_launcher"
  ios: true

  # Every image below is rendered from assets/brand/app_icon.svg (the designer's
  # vector master, in points_verts_assets) by tool/build_brand_assets.dart.
  image_path_android: "assets/launcher_icons/icon_1024.png"
  image_path_ios: "assets/launcher_icons/icon_1024.png"

  # iOS light: the artwork as delivered, on its own navy square.
  background_color_ios: "#002f69"
  remove_alpha_ios: true

  # iOS 18+ dark: the same artwork with the navy left transparent, so the
  # system draws its own dark backdrop behind it. The art is already dark, so
  # no separate dark design exists or is needed.
  image_path_ios_dark_transparent: "assets/launcher_icons/icon_1024_foreground.png"

  # iOS tinted: iOS maps this image's luminance onto the user's tint, so the
  # white text takes the tint fully and the orange comes out a lighter shade.
  image_path_ios_tinted_grayscale: "assets/launcher_icons/icon_1024_foreground.png"
  desaturate_tinted_to_grayscale_ios: true

  # Android: navy adaptive-icon background, artwork as the foreground, and a
  # white silhouette for Android 13+ themed icons. mipmap-anydpi-v26/
  # ic_launcher.xml insets both layers by 16%, which makes the artwork just fill
  # the visible area; launcher masks trim the corner footprints, which already
  # run off the edge by design.
  adaptive_icon_background: "#002f69"
  adaptive_icon_foreground: "assets/launcher_icons/icon_1024_foreground.png"
  adaptive_icon_monochrome: "assets/launcher_icons/icon_1024_monochrome.png"
