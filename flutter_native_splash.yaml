flutter_native_splash:
  # Regenerate with `dart run flutter_native_splash:create` (tool/release.sh
  # does this on every release build).
  #
  # The app icon's artwork, centred on its own navy. The navy is already dark,
  # so light and dark mode share one splash.
  #
  # splash_icon.png is rendered from assets/brand/app_icon.svg by
  # tool/build_brand_assets.dart: 1152x1152, the art clipped to the centred
  # 768 px circle that Android 12+ requires. Older Android and iOS reuse the
  # same image (read as 4x density, i.e. 288 dp/pt), so every platform shows
  # exactly the same splash.
  color: "#002f69"
  image: assets/splash/splash_icon.png
  android_gravity: center
  ios_content_mode: center

  android_12:
    color: "#002f69"
    image: assets/splash/splash_icon.png
